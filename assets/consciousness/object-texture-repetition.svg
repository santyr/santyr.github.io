<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Two different kinds of repetition</title>
<desc id="desc">Identical tree silhouettes occupy irregular positions in one panel. Repeating rocks and sprigs form a periodic ground pattern in another.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><g id="tree"><path d="M0 20V-34 M0 9L-22-9 M0-3L23-24 M0-16L-15-32 M0 18L16 1" fill="none" stroke="#17577b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0-61L-28-27H-17L-34-7H-13L-28 13H28L13-7H34L17-27H28Z" fill="#dce8e7" stroke="#17577b" stroke-width="2"/><path d="M0 15V30" fill="none" stroke="#17577b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="tile"><path d="M-14 8L-9-4L5-8L16 4L10 10Z" fill="#dce8e7" stroke="#17577b" stroke-width="2"/><path d="M24 8V-12 M24-3Q8-13 15-18Q25-18 24-3 M24-6Q42-18 36-21Q25-20 24-6" fill="none" stroke="#b89651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></defs>
<rect width="720" height="620" fill="#fffef9"/>
<g font-family="system-ui,-apple-system,sans-serif">
<text x="32" y="46" font-size="31" fill="#102b44" text-anchor="start" font-weight="400" font-family="Georgia,serif">Two different kinds of repetition</text>
<path d="M32 70H688" fill="none" stroke="#d8dddb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<rect x="32" y="96" width="656" height="211" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="54" y="132" font-size="26" fill="#102b44" text-anchor="start" font-weight="600">A · Repeated appearance</text><use href="#tree" transform="translate(113 231) scale(.8)"/><use href="#tree" transform="translate(266 206) scale(.8)"/><use href="#tree" transform="translate(386 235) scale(.8)"/><use href="#tree" transform="translate(576 219) scale(.8)"/><text x="54" y="283" font-size="21" fill="#4b6070" text-anchor="start" font-weight="400">Irregular positions; the same apparent form.</text><rect x="32" y="333" width="656" height="233" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="54" y="371" font-size="26" fill="#102b44" text-anchor="start" font-weight="600">B · Repeated arrangement</text><use href="#tile" transform="translate(92 424)"/><use href="#tile" transform="translate(183 424)"/><use href="#tile" transform="translate(274 424)"/><use href="#tile" transform="translate(365 424)"/><use href="#tile" transform="translate(456 424)"/><use href="#tile" transform="translate(547 424)"/><use href="#tile" transform="translate(638 424)"/><use href="#tile" transform="translate(92 481)"/><use href="#tile" transform="translate(183 481)"/><use href="#tile" transform="translate(274 481)"/><use href="#tile" transform="translate(365 481)"/><use href="#tile" transform="translate(456 481)"/><use href="#tile" transform="translate(547 481)"/><use href="#tile" transform="translate(638 481)"/><text x="54" y="542" font-size="21" fill="#4b6070" text-anchor="start" font-weight="400">The arrangement itself appears periodic.</text>
<text x="32" y="600" font-size="14" fill="#4b6070" text-anchor="start" font-weight="400">CONCEPTUAL ILLUSTRATION · NOT OBSERVED DATA</text>
</g></svg>
