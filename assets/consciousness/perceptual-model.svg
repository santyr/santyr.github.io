<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Perception as a feedback process</title>
<desc id="desc">Sensory evidence and learned structure jointly constrain a current interpretation; predictions are compared with further evidence and revised.</desc>
