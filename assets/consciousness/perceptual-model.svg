<text x="32" y="46" font-size="31" fill="#102b44" text-anchor="start" font-weight="400" font-family="Georgia,serif">Perception as a feedback process</text>
<path d="M32 70H688" fill="none" stroke="#d8dddb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<rect x="32" y="101" width="302" height="113" rx="8" fill="#edf2f0" stroke="#d8dddb"/><rect x="386" y="101" width="302" height="113" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="53" y="142" font-size="25" fill="#102b44" text-anchor="start" font-weight="600">Sensory evidence</text><text x="53" y="183" font-size="21" fill="#4b6070" text-anchor="start" font-weight="400">Light · edges · motion</text><text x="407" y="142" font-size="25" fill="#102b44" text-anchor="start" font-weight="600">Learned structure</text><text x="407" y="183" font-size="21" fill="#4b6070" text-anchor="start" font-weight="400">Expectations · memory</text><path d="M183 220V246H312V276" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M537 220V246H408V276" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="154" y="284" width="412" height="112" rx="8" fill="#eaf0f1" stroke="#d8dddb"/><text x="360" y="328" font-size="27" fill="#102b44" text-anchor="middle" font-weight="600">Current interpretation</text><text x="360" y="365" font-size="22" fill="#4b6070" text-anchor="middle" font-weight="400">Objects, surfaces, and scene</text><rect x="32" y="456" width="302" height="111" rx="8" fill="#edf2f0" stroke="#d8dddb"/><rect x="386" y="456" width="302" height="111" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="53" y="497" font-size="23" fill="#102b44" text-anchor="start" font-weight="600">Expected appearance</text><text x="53" y="536" font-size="21" fill="#4b6070" text-anchor="start" font-weight="400">A prediction to check</text><text x="407" y="497" font-size="23" fill="#102b44" text-anchor="start" font-weight="600">Compare and revise</text><text x="407" y="536" font-size="20" fill="#4b6070" text-anchor="start" font-weight="400">Further sensory evidence</text><path d="M230 402V427H183V448" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340 512H378" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M537 448V427H491V402" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
