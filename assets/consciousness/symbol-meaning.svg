<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Recognition is not interpretation</title>
<desc id="desc">Contours and junctions combine into writing-like marks. Recognition can lead either to interpretation through a known mapping or to an expectation of meaning without an available reading.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker></defs>
<rect width="720" height="620" fill="#fffef9"/>
<g font-family="system-ui,-apple-system,sans-serif">
<text x="32" y="46" font-size="31" fill="#102b44" text-anchor="start" font-weight="400" font-family="Georgia,serif">Recognition is not interpretation</text>
<path d="M32 70H688" fill="none" stroke="#d8dddb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<rect x="32" y="97" width="656" height="119" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="360" y="132" font-size="24" fill="#102b44" text-anchor="middle" font-weight="600">Contours and junctions</text><path d="M179 164V193 M218 193Q240 152 260 185 M303 164L329 193 M329 164L303 193 M375 167H411 M393 167V197 M461 170L475 190L489 170" fill="none" stroke="#17577b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 223V252" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="128" y="260" width="464" height="95" rx="8" fill="#eaf0f1" stroke="#d8dddb"/><text x="360" y="300" font-size="26" fill="#102b44" text-anchor="middle" font-weight="600">“This resembles writing.”</text><text x="360" y="333" font-size="21" fill="#4b6070" text-anchor="middle" font-weight="400">A visual classification</text><path d="M275 362V381H183V399" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M445 362V381H537V399" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="407" width="302" height="110" rx="8" fill="#edf2f0" stroke="#d8dddb"/><rect x="386" y="407" width="302" height="110" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="183" y="444" font-size="24" fill="#102b44" text-anchor="middle" font-weight="600">Mapping available</text><text x="183" y="487" font-size="21" fill="#4b6070" text-anchor="middle" font-weight="400">A reading is possible.</text><text x="537" y="444" font-size="23" fill="#102b44" text-anchor="middle" font-weight="600">Mapping unavailable</text><text x="537" y="487" font-size="20" fill="#4b6070" text-anchor="middle" font-weight="400">Meaning may feel hidden.</text><text x="360" y="560" font-size="23" fill="#4b6070" text-anchor="middle" font-weight="400">A feeling of meaning does not verify a message.</text>
<text x="32" y="600" font-size="14" fill="#4b6070" text-anchor="start" font-weight="400">CONCEPTUAL ILLUSTRATION · NOT OBSERVED DATA</text>
</g></svg>
