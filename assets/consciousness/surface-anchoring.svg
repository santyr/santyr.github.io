<text x="32" y="113" font-size="23" fill="#102b44" text-anchor="start" font-weight="600">Surface texture</text><text x="254" y="113" font-size="23" fill="#102b44" text-anchor="start" font-weight="600">Apparent marks</text><text x="490" y="113" font-size="23" fill="#102b44" text-anchor="start" font-weight="600">Changed view</text><g transform="translate(32 172)"><use href="#weave"/></g><g transform="translate(254 172)"><use href="#marked"/></g><g transform="matrix(.91 .21 -.14 1 509 150)"><use href="#marked"/></g><path d="M216 251H243" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M443 251H476" fill="none" stroke="#17577b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="416" width="656" height="126" rx="8" fill="#edf2f0" stroke="#d8dddb"/><text x="56" y="459" font-size="26" fill="#102b44" text-anchor="start" font-weight="600">Same apparent surface, new viewpoint</text><text x="56" y="502" font-size="23" fill="#4b6070" text-anchor="start" font-weight="400">Marks and supporting texture transform together.</text>
