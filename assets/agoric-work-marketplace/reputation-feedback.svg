<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="679" viewBox="0 0 1040 679" role="img" aria-labelledby="title desc">
<title id="title">Reputation changes the price of future trust</title><desc id="desc">Contract outcomes are attested and evaluated independently. Positive work can improve future terms; proven breach can increase collateral and reduce access. Reputation is not an automatic spending key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="679" fill="#fffef9"/>
<text x="34" y="53" font-family="Georgia,serif" font-size="29" fill="#102b44">Reputation changes the price of future trust</text><path d="M34 78H1006" fill="none" stroke="#d8dddb" stroke-width="1.5"/>
<g font-family="system-ui,-apple-system,sans-serif"><text x="39" y="112" text-anchor="start" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">REPEATED VOLUNTARY CONTRACTS</text><rect x="40" y="132" width="284" height="108" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="57" y="165" font-size="20" font-weight="650" fill="#102b44">1 · Bounded agreement</text><text x="57" y="191" font-size="16" fill="#4b6070">Signed authority and escrow</text><text x="57" y="214" font-size="16" fill="#4b6070">No unapproved spending</text><rect x="376" y="132" width="285" height="108" rx="8" fill="#102b44" stroke="#d8dddb" stroke-width="1.2"/><text x="393" y="165" font-size="20" font-weight="650" fill="#ffffff">2 · Verified outcome</text><text x="393" y="191" font-size="16" fill="#d2dfeb">Evidence, review and appeals</text><text x="393" y="214" font-size="16" fill="#d2dfeb">Signed final attestation</text><rect x="713" y="132" width="285" height="108" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="730" y="165" font-size="20" font-weight="650" fill="#102b44">3 · Portable history</text><text x="730" y="191" font-size="16" fill="#4b6070">Identity-linked credentials</text><text x="730" y="214" font-size="16" fill="#4b6070">Separate fact and allegation</text><path d="M330 188H368" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M667 188H705" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M854 247V294H514V317" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="295" y="323" width="441" height="96" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="312" y="356" font-size="21" font-weight="650" fill="#102b44">4 · Independent risk assessment</text><text x="312" y="382" font-size="16" fill="#4b6070">Context, confidence and issuer diversity</text><path d="M514 426V460H250V491" fill="none" stroke="#d8dddb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M514 460H784V491" fill="none" stroke="#d8dddb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="43" y="496" width="424" height="98" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="60" y="529" font-size="21" font-weight="650" fill="#102b44">Reliable work</text><text x="60" y="555" font-size="16" fill="#4b6070">May lower collateral and friction</text><rect x="575" y="496" width="425" height="98" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="592" y="529" font-size="21" font-weight="650" fill="#102b44">Confirmed breach</text><text x="592" y="555" font-size="16" fill="#4b6070">May raise collateral / limit access</text><text x="521" y="642" text-anchor="middle" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">REPUTATION NEVER DIRECTLY AUTHORIZES ESCROW CONFISCATION</text></g>
<text x="34" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#4b6070">AGORIC WORK MARKETPLACE  /  PROPOSED MECHANISM · NOT DEPLOYED</text>
</svg>