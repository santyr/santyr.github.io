<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="728" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">Escrow outcomes need explicit authority</title><desc id="desc">A funded contract is reviewed and enters fulfillment, agreed modification or a contested adjudication path before settlement. An independently verified transfer produces a separate reputational record.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="728" fill="#fffef9"/>
<text x="34" y="53" font-family="Georgia,serif" font-size="29" fill="#102b44">Escrow outcomes need explicit authority</text><path d="M34 78H1006" fill="none" stroke="#d8dddb" stroke-width="1.5"/>
<g font-family="system-ui,-apple-system,sans-serif"><text x="45" y="113" text-anchor="start" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">SIGNED CONTRACT + VERIFIED FUNDING</text><rect x="286" y="131" width="466" height="97" rx="8" fill="#102b44" stroke="#d8dddb" stroke-width="1.2"/><text x="303" y="164" font-size="22" font-weight="650" fill="#ffffff">Task or reputation commitment</text><text x="303" y="190" font-size="16" fill="#d2dfeb">Exact amount · beneficiaries · dispute windows</text><path d="M519 233V271" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="363" y="277" width="314" height="96" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="380" y="310" font-size="20" font-weight="650" fill="#102b44">Evidence and review</text><text x="380" y="336" font-size="16" fill="#4b6070">Authenticated, context-aware decision</text><path d="M363 328H189V414" fill="none" stroke="#d8dddb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M677 328H843V414" fill="none" stroke="#d8dddb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M518 378V413" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="420" width="292" height="116" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="59" y="453" font-size="22" font-weight="650" fill="#102b44">Fulfilled</text><text x="59" y="479" font-size="16" fill="#4b6070">Work fee paid; collateral</text><text x="59" y="502" font-size="16" fill="#4b6070">released or remains locked</text><rect x="374" y="420" width="290" height="116" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="391" y="453" font-size="22" font-weight="650" fill="#102b44">Agreed adjustment</text><text x="391" y="479" font-size="16" fill="#4b6070">Cancellation, partial work</text><text x="391" y="502" font-size="16" fill="#4b6070">and permitted refunds</text><rect x="705" y="420" width="293" height="116" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="722" y="453" font-size="22" font-weight="650" fill="#102b44">Contested</text><text x="722" y="479" font-size="16" fill="#4b6070">Time-bounded arbitration</text><text x="722" y="502" font-size="16" fill="#4b6070">and possible appeal</text><path d="M190 541V577H520V590" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M519 541V590" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M850 541V577H520V590" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="320" y="596" width="398" height="91" rx="8" fill="#102b44" stroke="#d8dddb" stroke-width="1.2"/><text x="337" y="629" font-size="21" font-weight="650" fill="#ffffff">Verified rail settlement</text><text x="337" y="655" font-size="16" fill="#d2dfeb">Separate signed outcome attestation</text></g>
