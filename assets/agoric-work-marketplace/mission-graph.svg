<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="805" viewBox="0 0 1040 805" role="img" aria-labelledby="title desc">
<title id="title">Bounded delegation across a mission</title><desc id="desc">The mission branches into inspection and pricing, converges on procurement, then moves through independently authorized installation and verification.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="arrgold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="805" fill="#fffef9"/><path d="M32 78H1008" stroke="#d8dddb" stroke-width="1.5"/>
<text x="32" y="51" font-family="Georgia,serif" font-size="31" fill="#102b44">Bounded delegation across a mission</text>
<g font-family="system-ui,-apple-system,sans-serif"><text x="43" y="116" font-size="15" font-weight="650" fill="#4b6070" text-anchor="start" letter-spacing=".8">ONE OBJECTIVE · MULTIPLE AUTHORIZED CONTRACTS</text><rect x="326" y="134" width="389" height="87" rx="9" fill="#102b44" stroke="#d8dddb" stroke-width="1.4"/><text x="346" y="168" font-size="24" font-weight="650" fill="#ffffff">Maintenance objective</text><text x="346" y="196" font-size="17" fill="#d1e2ef">Sponsor controls total mission budget</text><path d="M521 224V252H248V285" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M521 224V252H785V285" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="40" y="289" width="416" height="105" rx="9" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.4"/><text x="60" y="323" font-size="21" font-weight="650" fill="#102b44">1 · Inspect and specify</text><text x="60" y="351" font-size="17" fill="#4b6070">Measurements · photographs · diagnosis</text><rect x="579" y="289" width="421" height="105" rx="9" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.4"/><text x="599" y="323" font-size="21" font-weight="650" fill="#102b44">2 · Locate and price</text><text x="599" y="351" font-size="17" fill="#4b6070">Offers · part matching · authorized budget</text><path d="M248 397V434H521V456" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M785 397V434H521V456" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="324" y="462" width="394" height="99" rx="9" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="344" y="496" font-size="21" font-weight="650" fill="#102b44">3 · Authorized procurement</text><text x="344" y="524" font-size="17" fill="#4b6070">Human purchase under explicit mandate</text><path d="M718 510H795V562" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="737" y="567" width="263" height="104" rx="9" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.4"/><text x="757" y="601" font-size="19" font-weight="650" fill="#102b44">4 · Qualified installation</text><text x="757" y="629" font-size="17" fill="#4b6070">New contract · separate authority</text><path d="M737 619H675V710H570" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="40" y="682" width="525" height="81" rx="9" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.4"/><text x="60" y="716" font-size="20" font-weight="650" fill="#102b44">5 · Independent completion check</text><text x="60" y="744" font-size="17" fill="#4b6070">Evidence and payout per stage; no implied permissions</text></g><text x="32" y="783" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#4b6070">AGORIC WORK MARKETPLACE  /  CONCEPT FIGURE · NOT A DEPLOYED SYSTEM</text></svg>