<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="644" viewBox="0 0 1040 644" role="img" aria-labelledby="title desc">
<title id="title">Payment is not the same as performance</title><desc id="desc">A contract moves from separately verified funding and work evidence to review, then either verified payout or a negotiated dispute and refund process.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="arrgold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="644" fill="#fffef9"/><path d="M32 78H1008" stroke="#d8dddb" stroke-width="1.5"/>
<text x="32" y="51" font-family="Georgia,serif" font-size="31" fill="#102b44">Payment is not the same as performance</text>
<g font-family="system-ui,-apple-system,sans-serif"><rect x="40" y="118" width="299" height="95" rx="9" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.4"/><text x="60" y="152" font-size="22" font-weight="650" fill="#102b44">Signed agreement</text><text x="60" y="180" font-size="17" fill="#4b6070">Scope · acceptance · budget</text><rect x="376" y="118" width="290" height="95" rx="9" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="396" y="152" font-size="22" font-weight="650" fill="#102b44">Verified funding</text><text x="396" y="180" font-size="17" fill="#4b6070">Worker fee reserved</text><rect x="705" y="118" width="295" height="95" rx="9" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.4"/><text x="725" y="152" font-size="22" font-weight="650" fill="#102b44">Work &amp; evidence</text><text x="725" y="180" font-size="17" fill="#4b6070">Private submission and proof</text><path d="M343 167H370" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M670 167H699" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M853 218V277H520V305" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="360" y="312" width="323" height="97" rx="9" fill="#102b44" stroke="#d8dddb" stroke-width="1.4"/><text x="380" y="346" font-size="21" font-weight="650" fill="#ffffff">Independent review</text><text x="380" y="374" font-size="17" fill="#d1e2ef">Rules from contract revision</text><path d="M360 359H183V452" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M683 359H852V452" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="42" y="461" width="319" height="100" rx="9" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.4"/><text x="62" y="495" font-size="21" font-weight="650" fill="#102b44">Accepted → release</text><text x="62" y="523" font-size="17" fill="#4b6070">Verify mint / wallet settlement</text><rect x="685" y="461" width="314" height="100" rx="9" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="705" y="495" font-size="21" font-weight="650" fill="#102b44">Disputed → arbitrate</text><text x="705" y="523" font-size="17" fill="#4b6070">Remedy · refund · recheck</text><text x="521" y="441" font-size="15" font-weight="650" fill="#4b6070" text-anchor="middle" letter-spacing=".8">OUTCOMES</text><text x="521" y="606" font-size="15" font-weight="650" fill="#4b6070" text-anchor="middle" letter-spacing=".8">MERCHANDISE / APPROVED EXPENSES ARE ACCOUNTED FOR SEPARATELY</text></g><text x="32" y="622" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#4b6070">AGORIC WORK MARKETPLACE  /  CONCEPT FIGURE · NOT A DEPLOYED SYSTEM</text></svg>