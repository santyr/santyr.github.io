<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="657" viewBox="0 0 1040 657" role="img" aria-labelledby="title desc">
<title id="title">Where escrow, bonds, and service fees go</title><desc id="desc">Three separate financial instruments: provider revenue, conditional reputation bond, and job-specific payment escrow. Exceptions require evidence, agreed adjudication, bounded remedies, and verified transfers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="657" fill="#fffef9"/>
<text x="34" y="53" font-family="Georgia,serif" font-size="29" fill="#102b44">Where escrow, bonds, and service fees go</text><path d="M34 78H1006" fill="none" stroke="#d8dddb" stroke-width="1.5"/>
<g font-family="system-ui,-apple-system,sans-serif"><text x="42" y="112" text-anchor="start" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">THREE DISTINCT FINANCIAL INSTRUMENTS</text><rect x="42" y="145" width="292" height="102" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="59" y="178" font-size="22" font-weight="650" fill="#102b44">Service fee</text><text x="59" y="204" font-size="16" fill="#4b6070">Customer pays provider</text><text x="59" y="227" font-size="16" fill="#4b6070">Upon service delivery</text><rect x="374" y="145" width="292" height="102" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="391" y="178" font-size="22" font-weight="650" fill="#102b44">Reputation bond</text><text x="391" y="204" font-size="16" fill="#4b6070">Owned, conditionally locked</text><text x="391" y="227" font-size="16" fill="#4b6070">Release or bounded remedy</text><rect x="706" y="145" width="292" height="102" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="723" y="178" font-size="22" font-weight="650" fill="#102b44">Job escrow</text><text x="723" y="204" font-size="16" fill="#4b6070">Sponsor pre-funds work</text><text x="723" y="227" font-size="16" fill="#4b6070">Worker pay or refund</text><path d="M187 252V313" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520 252V313" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M852 252V313" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="320" width="292" height="110" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="59" y="353" font-size="20" font-weight="650" fill="#102b44">Selected service provider</text><text x="59" y="379" font-size="16" fill="#4b6070">Receives disclosed fees</text><text x="59" y="402" font-size="16" fill="#4b6070">No penalty windfall</text><rect x="374" y="320" width="292" height="110" rx="8" fill="#102b44" stroke="#d8dddb" stroke-width="1.2"/><text x="391" y="353" font-size="20" font-weight="650" fill="#ffffff">Agreed release rules</text><text x="391" y="379" font-size="16" fill="#d2dfeb">Refund uncommitted balance</text><text x="391" y="402" font-size="16" fill="#d2dfeb">Restitute proven losses</text><rect x="706" y="320" width="292" height="110" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="723" y="353" font-size="20" font-weight="650" fill="#102b44">Settlement verification</text><text x="723" y="379" font-size="16" fill="#4b6070">Check actual rail receipts</text><text x="723" y="402" font-size="16" fill="#4b6070">Not Nostr claims</text><text x="521" y="463" text-anchor="middle" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">DISPUTE / EXCEPTION OUTCOMES</text><path d="M522 434V481" fill="none" stroke="#17577b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="192" y="488" width="657" height="94" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="209" y="521" font-size="20" font-weight="650" fill="#102b44">Evidence + independent decision + bounded contract remedies</text><text x="209" y="547" font-size="16" fill="#4b6070">Rights to funds depend on agreed rules and custody assumptions</text><text x="521" y="621" text-anchor="middle" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">NO MANDATORY SHARED TREASURY · NO AUTOMATIC BURN OR SLASH</text></g>
<text x="34" y="638" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#4b6070">AGORIC WORK MARKETPLACE  /  PROPOSED MECHANISM · NOT DEPLOYED</text>
</svg>