h="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M728 333H784V408H806" fill="none" stroke="#17577b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="805" y="145" width="201" height="105" rx="9" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="825" y="179" font-size="19" font-weight="650" fill="#102b44">Evaluator A</text><text x="825" y="207" font-size="17" fill="#4b6070">Safety and verified</text><text x="825" y="231" font-size="17" fill="#4b6070">qualifications matter</text><rect x="805" y="364" width="201" height="105" rx="9" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="825" y="398" font-size="19" font-weight="650" fill="#102b44">Evaluator B</text><text x="825" y="426" font-size="17" fill="#4b6070">Delivery speed and</text><text x="825" y="450" font-size="17" fill="#4b6070">payment history matter</text><text x="424" y="497" font-size="15" font-weight="650" fill="#4b6070" text-anchor="start" letter-spacing=".8">NO UNIVERSAL SCORE · NO SIGNATURE-BASED GUARANTEE OF FACTUAL TRUTH</text><text x="424" y="525" font-size="15" font-weight="650" fill="#4b6070" text-anchor="start" letter-spacing=".8">NEW IDENTITIES START UNPROVEN, NOT PRESUMED GUILTY</text></g><text x="32" y="546" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#4b6070">AGORIC WORK MARKETPLACE  /  CONCEPT FIGURE · NOT A DEPLOYED SYSTEM</text></svg>