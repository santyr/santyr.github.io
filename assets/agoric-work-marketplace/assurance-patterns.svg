<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="684" viewBox="0 0 1040 684" role="img" aria-labelledby="title desc">
<title id="title">Match each marketplace failure to its remedy</title><desc id="desc">A grid of six distinct threats and their candidate protections, linked conceptually to bounded verified commitments rather than a universal reputation score or one catchall escrow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#17577b" stroke-width="1.5"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b89651" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="684" fill="#fffef9"/>
<text x="34" y="53" font-family="Georgia,serif" font-size="29" fill="#102b44">Match each marketplace failure to its remedy</text><path d="M34 78H1006" fill="none" stroke="#d8dddb" stroke-width="1.5"/>
<g font-family="system-ui,-apple-system,sans-serif"><text x="44" y="112" text-anchor="start" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">THREAT-SPECIFIC PROTECTION</text><rect x="43" y="137" width="385" height="95" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="60" y="170" font-size="20" font-weight="650" fill="#102b44">Identity and listing spam</text><text x="60" y="196" font-size="16" fill="#4b6070">Paid service access · quotas · rate limits</text><rect x="611" y="137" width="385" height="95" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="628" y="170" font-size="20" font-weight="650" fill="#102b44">Nonpayment to workers</text><text x="628" y="196" font-size="16" fill="#4b6070">Verified pre-funded job escrow</text><rect x="43" y="262" width="385" height="95" rx="8" fill="#edf2f0" stroke="#d8dddb" stroke-width="1.2"/><text x="60" y="295" font-size="20" font-weight="650" fill="#102b44">No-shows or avoidable loss</text><text x="60" y="321" font-size="16" fill="#4b6070">Capped performance bond · due process</text><rect x="611" y="262" width="385" height="95" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="628" y="295" font-size="20" font-weight="650" fill="#102b44">Fabricated evidence</text><text x="628" y="321" font-size="16" fill="#4b6070">Independent checks · appeal · attestation</text><rect x="43" y="387" width="385" height="95" rx="8" fill="#f5eee0" stroke="#b89651" stroke-width="2"/><text x="60" y="420" font-size="20" font-weight="650" fill="#102b44">Wash-traded reputation</text><text x="60" y="446" font-size="16" fill="#4b6070">Issuer diversity · correlation analysis</text><rect x="611" y="387" width="385" height="95" rx="8" fill="#eaf0f1" stroke="#d8dddb" stroke-width="1.2"/><text x="628" y="420" font-size="20" font-weight="650" fill="#102b44">False disputes and coercion</text><text x="628" y="446" font-size="16" fill="#4b6070">Contestable claims · reviewer independence</text><rect x="242" y="514" width="557" height="100" rx="8" fill="#102b44" stroke="#d8dddb" stroke-width="1.2"/><text x="259" y="547" font-size="20" font-weight="650" fill="#ffffff">Shared verification and consent boundary</text><text x="259" y="573" font-size="16" fill="#d2dfeb">Signed commitments · private evidence · limited liability</text><text x="521" y="651" text-anchor="middle" font-size="14" font-weight="650" letter-spacing=".8" fill="#4b6070">NO SINGLE DEPOSIT PROTECTS AGAINST ALL MARKET FAILURES</text></g>
<text x="34" y="665" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#4b6070">AGORIC WORK MARKETPLACE  /  PROPOSED MECHANISM · NOT DEPLOYED</text>
</svg>