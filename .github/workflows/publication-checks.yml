name: Publication verification
on:
  push:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  generated-site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install publication test dependencies
        run: python -m pip install -r publication-requirements.txt
      - name: Source regression tests
        run: python -m unittest discover -s tests -v
      - name: Build with the same Jekyll action used by Pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: .
          destination: ./_site
          build_revision: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated pages, graphics, links, and anchors
        run: python tests/verify_publication.py --site _site
  deployed-site:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify public HTTP pages after deployment
        run: python tests/verify_publication.py --attempts 10
